<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quant Prep">
<meta name="theme-color" content="#2445c4">
<title>Quant Prep Room</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="mark">∫</span>Quant Prep Room</div>
    <nav class="tabs" aria-label="Sections">
      <a href="#today" data-v="today">Today</a>
      <a href="#review" data-v="review">Review<span class="badge" id="s-due" hidden></span></a>
      <a href="#train" data-v="train">Training</a>
      <a href="#plan" data-v="plan">Plan</a>
      <a href="#targets" data-v="targets">Interview set</a>
      <a href="#books" data-v="books">Books</a>
      <a href="#symbols" data-v="symbols">Symbols</a>
      <a href="#tutor" data-v="tutor">Tutor</a>
    </nav>
    <div class="stats"><span>Streak <b id="s-streak">0</b></span><span>Done <b id="s-done">0%</b></span></div>
    <div class="voicebox">
      <button type="button" class="btn sm" id="voiceBtn" aria-haspopup="dialog" aria-expanded="false"><span class="vdot"></span><span id="voiceLbl">Voice</span></button>
      <div class="voicepop" id="voicePop" role="dialog" aria-label="Tutor voice" hidden></div>
    </div>
  </div>
</header>

<main id="main"><div class="wrap" id="view"></div></main>

<script src="/js/mathjax-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js" integrity="sha512-zAs8dHhwlTbfcVGRX1x0EZAH/L99NjAFzX6muwOcOJc7dbGFNaW4O7b9QOyCMRYBNjO+E0Kx6yLDsiPQhhWm7g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js" integrity="sha512-H+rglffZ6f5gF7UJgvH4Naa+fGCgjrHKMgoFOGmcPTRwR6oILo5R+gtzNrpDp7iMV3udbymBVjkeZGNz1Em4rQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<script src="/js/curriculum.js"></script>
<script src="/js/calc.js"></script>
<script src="/js/platform.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
